name: CI

# Every action is pinned to a commit SHA, with the readable version in a
# trailing comment. A tag is a moving pointer its owner can repoint at any
# time, so a tag-pinned workflow runs whatever that account pushes next, with
# this repository's token. Dependabot reads the comment and keeps the pin
# current, so the pinning costs nothing to maintain.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Gates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, current LTS, and the
        # version production actually runs on. Testing only one of them
        # leaves the others unverified for contributors or for users.
        node: [22.22.2, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` here on purpose. The action now errors out when a
      # version is pinned both here and in package.json's `packageManager`,
      # so `packageManager` is the single source of truth — which also keeps
      # CI on the exact pnpm a contributor gets locally.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The combined schema is what someone without the Supabase CLI pastes
      # into the SQL editor, so a stale one breaks first-run setup silently.
      # It is generated, and this proves it was regenerated.
      - name: Check combined schema is current
        run: pnpm schema:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          AI_API_KEY: ci-placeholder-model-provider-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload coverage
        if: always() && matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` here — see the note in the `verify` job above.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production dependencies only: a dev-tool advisory should not block a
      # release, but anything reachable at runtime should.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate
