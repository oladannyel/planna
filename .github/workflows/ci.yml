name: CI

# Every action is pinned to a commit SHA, with the readable version in a
# trailing comment. A tag is a moving pointer its owner can repoint at any
# time, so a tag-pinned workflow runs whatever that account pushes next, with
# this repository's token. Dependabot reads the comment and keeps the pin
# current, so the pinning costs nothing to maintain.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Gates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, current LTS, and the
        # version production actually runs on. Testing only one of them
        # leaves the others unverified for contributors or for users.
        node: [22.22.2, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` here on purpose. The action now errors out when a
      # version is pinned both here and in package.json's `packageManager`,
      # so `packageManager` is the single source of truth — which also keeps
      # CI on the exact pnpm a contributor gets locally.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The combined schema is what someone without the Supabase CLI pastes
      # into the SQL editor, so a stale one breaks first-run setup silently.
      # It is generated, and this proves it was regenerated.
      - name: Check combined schema is current
        run: pnpm schema:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          AI_API_KEY: ci-placeholder-model-provider-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload coverage
        if: always() && matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only. A second engine doubles the slowest job in the matrix
      # to re-test the same application logic; the things these specs cover —
      # drag, the auth round trip, the CSP, axe — are not engine-specific.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Supabase
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: latest

      # Brings up Postgres, Auth and the mail catcher, applies every migration
      # and seeds the demo workspace the specs sign in as.
      - name: Start the local stack
        run: supabase start

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` here — see the note in the `verify` job above.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production dependencies only: a dev-tool advisory should not block a
      # release, but anything reachable at runtime should.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

  # One stable name for branch protection to require.
  #
  # Requiring the matrix jobs directly looks tempting and is a trap: their
  # check names contain the version — "Gates (Node 22.22.2)" — so the day the
  # Node floor moves, the required check names a job that no longer runs and
  # every pull request blocks forever on a green tree. This job's name never
  # changes, so the matrix can change freely underneath it.
  gates:
    name: All gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [verify, e2e, audit]

    # `always()` so this still runs when something upstream failed. Without it
    # a failure upstream *skips* this job, and a skipped required check does
    # not read as a failure — which is precisely the hole it exists to close.
    if: always()

    steps:
      - name: Fail unless every gate succeeded
        env:
          VERIFY: ${{ needs.verify.result }}
          E2E: ${{ needs.e2e.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          echo "gates:        $VERIFY"
          echo "end-to-end:   $E2E"
          echo "audit:        $AUDIT"
          # Explicitly "success" — not "not failure". Cancelled and skipped
          # are both not-failure, and neither is evidence the tree is good.
          test "$VERIFY" = success && test "$E2E" = success && test "$AUDIT" = success
