name: CodeQL

# Actions pinned to commit SHAs — see the note in ci.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a scan be re-run by hand, which matters because a failure can be
  # about repository settings rather than code: this one spent a day red
  # only because code scanning was off while the repo was private.
  workflow_dispatch:

  schedule:
    # Weekly, so a newly published advisory is found without waiting for the
    # next commit. A repository nobody has pushed to in a month is exactly the
    # one where a scheduled scan earns its keep.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Required to upload results to the Security tab.
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          language: ${{ matrix.language }}
          # security-extended adds lower-severity and quality queries beyond
          # the default set.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  # A stable check name for branch protection — see the note on `gates` in
  # ci.yml. The analyze job is per-language, so its check name moves whenever
  # the language matrix does.
  scanning:
    name: Code scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [analyze]
    if: always()

    steps:
      - name: Fail unless the analysis succeeded
        env:
          ANALYZE: ${{ needs.analyze.result }}
        run: |
          echo "analyze: $ANALYZE"
          test "$ANALYZE" = success
