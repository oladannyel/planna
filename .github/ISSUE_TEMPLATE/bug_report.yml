name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do **not** use this form for security issues — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Type ...
        3. See ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Task capture / parsing
        - Kanban board
        - Daily or weekly planning
        - Analytics
        - Monthly or AI reports
        - Ethics check-in
        - Request links
        - Auth / login
        - Setup / migrations
        - Other
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: "20.x / 24.x"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or errors
      description: Redact any keys, tokens or personal task content before pasting.
      render: shell
